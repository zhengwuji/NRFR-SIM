name: Build APK

# 每次代码变动(push)自动编译 APK 并发布到 Releases;
# 仅修改 README/文档不触发。手动触发(workflow_dispatch)始终可用。
on:
  push:
    branches:
      - "**"
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: write

# 同一分支的新 push 会取消仍在运行的旧构建
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  # Shizuku v13.6.0(最新版,支持 Android 16 QPR1),固定版本 + SHA-256 保证可复现
  SHIZUKU_VERSION: "13.6.0"
  SHIZUKU_APK: "shizuku-v13.6.0.r1086.2650830c-release.apk"
  SHIZUKU_SHA256: "6e273ab0e991c4e79bc8b1bbb9b9dd739ccac1a8712a541a214078886b7b790f"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 版本单源:基础版本号取自 gradle.properties;
      # push 构建追加构建号(如 1.1.0-r42),tag 构建直接用 tag 名。
      - name: Resolve Version
        id: version
        shell: bash
        run: |
          BASE=$(grep -E '^APP_VERSION_NAME=' gradle.properties | cut -d '=' -f2 | tr -d ' \r')
          BASE_CODE=$(grep -E '^APP_VERSION_CODE=' gradle.properties | cut -d '=' -f2 | tr -d ' \r')
          if [ -z "$BASE" ]; then echo "APP_VERSION_NAME missing in gradle.properties"; exit 1; fi
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            VERSION_CODE="$BASE_CODE"
          else
            VERSION="${BASE}-r${GITHUB_RUN_NUMBER}"
            VERSION_CODE=$(( BASE_CODE * 1000 + GITHUB_RUN_NUMBER ))
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "code=${VERSION_CODE}" >> $GITHUB_OUTPUT
          echo "Building ${VERSION} (versionCode ${VERSION_CODE})"

      # 生成中文更新内容:取上个 tag 以来的提交(排除 ci:/docs: 提交)
      - name: Generate Changelog
        id: changelog
        shell: bash
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            RAW=$(git log --pretty=format:"- %s" "$PREV_TAG"..HEAD)
          else
            RAW=$(git log --pretty=format:"- %s" -20)
          fi
          COMMITS=$(echo "$RAW" | grep -v -E "^- (ci:|docs:|chore\(ci\))" || true)
          if [ -z "$COMMITS" ]; then
            COMMITS="- 例行构建与维护更新"
          fi
          {
            echo "## 📦 更新内容"
            echo ""
            echo "$COMMITS"
            echo ""
            echo "## ℹ️ 构建信息"
            echo ""
            echo "- **版本**: ${{ steps.version.outputs.version }}"
            echo "- **构建号**: #${{ github.run_number }}"
            echo "- **提交**: ${{ github.sha }}"
            echo "- **分支**: ${{ github.ref_name }}"
            echo ""
            echo "## 📲 安装说明"
            echo ""
            echo "1. 下载下方的 \`nrfr-${{ steps.version.outputs.version }}.apk\` 安装到手机"
            echo "2. 安装并启动 [Shizuku](https://github.com/RikkaApps/Shizuku/releases/latest),按应用内提示完成授权"
            echo "3. 打开 Nrfr,选择 SIM 卡并设置目标国家码,点击「保存生效」"
            echo ""
            echo "详细说明见项目 README。"
          } > 更新内容.md
          echo "---- 更新内容.md ----"
          cat 更新内容.md

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      # 提供确定版本的 Gradle,不依赖 runner 预装
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      # runner 自带 Android SDK(含 cmdline-tools);
      # 不用 android-actions/setup-android,它在 2025 镜像上会安装已废除的 tools 包而失败。
      # 这里直接用 sdkmanager 安装 android-36 平台并预接受许可。
      - name: Install Android Platform
        shell: bash
        run: |
          SDKROOT=$(cygpath -u "$ANDROID_HOME")
          SDKMANAGER=$(ls "$SDKROOT"/cmdline-tools/*/bin/sdkmanager.bat 2>/dev/null | sort -V | tail -n 1)
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" > /dev/null

      # 用含隐藏 API 的 android.jar 覆盖官方 jar(compileSdk 36 / Android 16)
      - name: Patch android.jar with hidden APIs
        shell: bash
        run: |
          SDKROOT=$(cygpath -u "$ANDROID_HOME")
          curl -L https://raw.githubusercontent.com/Reginer/aosp-android-jar/refs/heads/main/android-36/android.jar \
            -o "$SDKROOT/platforms/android-36/android.jar"
          ls -l "$SDKROOT/platforms/android-36/android.jar"

      # 构建 release APK(无 keystore 时 build.gradle.kts 自动回退 debug 签名)
      - name: Build APK
        run: gradle assembleRelease --no-daemon -PAPP_VERSION_NAME=${{ steps.version.outputs.version }} -PAPP_VERSION_CODE=${{ steps.version.outputs.code }}
        shell: bash

      # 下载固定版本 Shizuku 并校验 SHA-256(打包进附件目录,便于一起分发)
      - name: Download Shizuku APK
        shell: bash
        run: |
          mkdir -p dist
          curl -L "https://github.com/RikkaApps/Shizuku/releases/download/v${{ env.SHIZUKU_VERSION }}/${{ env.SHIZUKU_APK }}" \
            -o dist/shizuku-${{ env.SHIZUKU_VERSION }}.apk
          echo "${{ env.SHIZUKU_SHA256 }}  dist/shizuku-${{ env.SHIZUKU_VERSION }}.apk" | sha256sum -c -

      - name: Stage APK
        shell: bash
        run: |
          cp app/build/outputs/apk/release/app-release.apk nrfr-${{ steps.version.outputs.version }}.apk

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Nrfr ${{ steps.version.outputs.version }}
          body_path: 更新内容.md
          files: |
            nrfr-${{ steps.version.outputs.version }}.apk
            dist/shizuku-${{ env.SHIZUKU_VERSION }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
